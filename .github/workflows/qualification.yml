name: Release qualification

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    uses: ./.github/workflows/ci.yml
  vulnerabilities:
    uses: ./.github/workflows/security.yml
  native:
    name: Native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install and qualify native components
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/native-check" ./cmd/floe-native-apps
          "$RUNNER_TEMP/native-check" -state "$RUNNER_TEMP/native-state" 2>&1 | tee "$RUNNER_TEMP/qualification/install.log"
          root=$(find "$RUNNER_TEMP/native-state/packages" -mindepth 1 -maxdepth 1 -type d)
          test -n "$root"
          # The clean fixtures run as nobody and only read this disposable tree.
          chmod -R a+rX "$RUNNER_TEMP/native-state/packages" "$RUNNER_TEMP/native-check"
          NATIVE_CHECK="$RUNNER_TEMP/native-check" NATIVE_ROOT="$root" \
            ./scripts/qualify.sh 2>&1 | tee "$RUNNER_TEMP/qualification/native.log"
      - name: Qualify published legacy component update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-state"
          cp -R "$RUNNER_TEMP/native-state/archives" "$RUNNER_TEMP/legacy-state/archives"
          go run github.com/floegence/floe-native-apps/cmd/floe-native-apps@v0.2.1 \
            -state "$RUNNER_TEMP/legacy-state" 2>&1 | tee "$RUNNER_TEMP/qualification/legacy-install.log"
          FLOE_TEST_LEGACY_STATE="$RUNNER_TEMP/legacy-state" \
            go test -count=1 -run '^TestNativeLegacyComponentUpdate$' -v . \
            2>&1 | tee "$RUNNER_TEMP/qualification/legacy-update.log"
      - name: Install disposable application fixtures
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/input-browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 gnome-text-editor python3-pyqt5 python3-pyqt6 xterm x11-utils
          npx --yes playwright@1.58.2 install --with-deps chromium
          # Install Chromium's supplied sandbox only in this disposable runner.
          # Ubuntu's policy requires it for a browser outside a packaged profile.
          sandbox=$(python3 -c 'import os,pathlib; p=list(pathlib.Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"]).rglob("chrome_sandbox")); assert len(p)==1; print(p[0])')
          sudo install -o root -g root -m 4755 "$sandbox" "$RUNNER_TEMP/chrome-devel-sandbox"
          echo "CHROME_DEVEL_SANDBOX=$RUNNER_TEMP/chrome-devel-sandbox" >> "$GITHUB_ENV"
      - name: Qualify prepared browser cursors
        env:
          FLOE_TEST_CURSOR_BROWSERS: chromium,firefox,webkit
          FLOE_TEST_CURSOR_EVIDENCE: ${{ runner.temp }}/qualification/cursors
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/input-browsers
        run: |
          npm ci --prefix qualification --ignore-scripts --no-audit --no-fund
          node qualification/node_modules/playwright/cli.js install --with-deps firefox webkit
          go test -count=1 -run '^TestBrowserCursor$' -v .
      - name: Prepare reviewed HTML5 v21 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/html-v21"
          curl --fail --location https://codeload.github.com/Xpra-org/xpra-html5/tar.gz/refs/tags/v21 -o "$RUNNER_TEMP/html-v21.tar.gz"
          echo "ab639e099c1f12c9073489dd59bfef09b8601ff329cda8f0b989d8e175da9175  $RUNNER_TEMP/html-v21.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/html-v21.tar.gz" -C "$RUNNER_TEMP/html-v21" --strip-components=1
          echo "FLOE_TEST_LAYOUT_HTML_V21=$RUNNER_TEMP/html-v21/html5" >> "$GITHUB_ENV"
      - name: Prepare published bootstrap v1 viewer and input modules
        shell: bash
        run: |
          set -euo pipefail
          root=$(find "$RUNNER_TEMP/native-state/packages" -mindepth 1 -maxdepth 1 -type d)
          (cd qualification/legacy && GOWORK=off go run . "$RUNNER_TEMP/legacy-viewer" "$root/usr/share/xpra/www")
          echo "FLOE_TEST_LEGACY_VIEWER_FIXTURE=$RUNNER_TEMP/legacy-viewer/fixture.json" >> "$GITHUB_ENV"
      - name: Qualify authenticated client input in native applications
        env:
          FLOE_TEST_INPUT_EVIDENCE: ${{ runner.temp }}/qualification/client-input
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/input-browsers
        shell: bash
        run: |
          set -euo pipefail
          FLOE_TEST_INPUT_ROOT=$(find "$RUNNER_TEMP/native-state/packages" -mindepth 1 -maxdepth 1 -type d)
          export FLOE_TEST_INPUT_ROOT
          FLOE_TEST_CHROMIUM_BIN=$(node -e 'console.log(require("./qualification/node_modules/playwright").chromium.executablePath())')
          export FLOE_TEST_CHROMIUM_BIN
          "$FLOE_TEST_CHROMIUM_BIN" --version | tee "$RUNNER_TEMP/qualification/chromium-version.log"
          dpkg-query -W python3-pyqt5 python3-pyqt6 libgtk-3-0t64 libgtk-4-1 gnome-text-editor xterm \
            | tee "$RUNNER_TEMP/qualification/application-versions.log"
          go test -count=1 -run '^TestNative(ClientInput|DisplayInput|ViewerLayout|ViewerUpgrade)$' -v . \
            2>&1 | tee "$RUNNER_TEMP/qualification/client-input.log"
      - name: Qualify shared pointer ownership and native receipts
        env:
          FLOE_TEST_POINTER_BROWSERS: chromium,firefox,webkit
          FLOE_TEST_POINTER_EVIDENCE: ${{ runner.temp }}/qualification/pointers
          FLOE_TEST_POINTER_NATIVE: '1'
          FLOE_TEST_INPUT_FIXTURES: gtk,chromium
          FLOE_TEST_INPUT_EVIDENCE: ${{ runner.temp }}/qualification/native-pointers
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/input-browsers
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestBrowser(Pointer|InputFocus)$' -v .
          FLOE_TEST_INPUT_ROOT=$(find "$RUNNER_TEMP/native-state/packages" -mindepth 1 -maxdepth 1 -type d)
          export FLOE_TEST_INPUT_ROOT
          FLOE_TEST_CHROMIUM_BIN=$(node -e 'console.log(require("./qualification/node_modules/playwright").chromium.executablePath())')
          export FLOE_TEST_CHROMIUM_BIN
          go test -count=1 -run '^TestNativeClientInput$' -v .
      - name: Qualify GTK 4.0 and glibc 2.31 on the native architecture
        env:
          NATIVE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input_modules/certificates "$RUNNER_TEMP/baseline"
          cp /etc/ssl/certs/ca-certificates.crt input_modules/certificates/
          python3 scripts/fetch_input_toolkits.py
          base=$(python3 -c 'import json,os; print(json.load(open("input_modules/dist/"+os.environ["NATIVE_ARCH"]+"/build-qt5.json"))["builder_image"])')
          docker build --build-arg BASE_IMAGE="$base" --build-arg QT_MAJOR=5 \
            -f scripts/input_builder.Dockerfile -t floe-input-baseline .
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/baseline:/out" -w /src floe-input-baseline sh -c \
            'export PKG_CONFIG_PATH=/opt/gtk4/lib/pkgconfig; for fixture in baseline context; do cc qualification/gtk4_$fixture.c $(pkg-config --cflags --libs gtk4) -Wl,-rpath-link,/opt/gtk4/lib -o /out/gtk4-$fixture; done'
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/baseline/native-input.test" .
          root=$(find "$RUNNER_TEMP/native-state/packages" -mindepth 1 -maxdepth 1 -type d)
          mkdir -p "$RUNNER_TEMP/qualification/gtk4-baseline"
          # D-Bus authenticates against the fixture's user database. Use its
          # existing unprivileged account, not the runner's unknown numeric UID.
          sudo chown 65534:65534 "$RUNNER_TEMP/qualification/gtk4-baseline"
          trap 'sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/qualification/gtk4-baseline"' EXIT
          docker run --rm --user nobody -e HOME=/tmp -e XDG_CACHE_HOME=/tmp \
            -v "$PWD:/src:ro" \
            -v "$root:/components:ro" -v "$RUNNER_TEMP/baseline:/out:ro" \
            -v "$RUNNER_TEMP/qualification/gtk4-baseline:/evidence" -w /src \
            -e FLOE_TEST_INPUT_ROOT=/components -e FLOE_TEST_INPUT_FIXTURES=gtk4 \
            -e FLOE_TEST_GTK4_BASELINE=/out/gtk4-baseline -e FLOE_TEST_INPUT_EVIDENCE=/evidence \
            -e FLOE_TEST_GTK4_CONTEXT=/out/gtk4-context \
            floe-input-baseline /out/native-input.test -test.run '^TestNativeClientInput$' -test.v \
            2>&1 | tee "$RUNNER_TEMP/qualification/gtk4-baseline.log"
          FLOE_TEST_INPUT_ROOT="$root" FLOE_TEST_INPUT_FIXTURES=gtk4,gtk4-entry \
            FLOE_TEST_GTK4_CONTEXT="$RUNNER_TEMP/baseline/gtk4-context" \
            go test -count=1 -run '^TestNativeClientInput$' -v . \
            2>&1 | tee "$RUNNER_TEMP/qualification/gtk4-current-context.log"
      - name: Install signed system Xpra fixture
        run: |
          python3 scripts/prepare_system_xpra.py --arch "${{ matrix.arch }}" "$RUNNER_TEMP/xpra-debs"
          cp "$RUNNER_TEMP/xpra-debs/provenance.json" "$RUNNER_TEMP/qualification/system-xpra-packages.json"
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends \
            "$RUNNER_TEMP/xpra-debs/"*.deb \
            libx264-164 libxcb-imdkit1 libxcb-util1 dbus xauth
      - name: Qualify the same input contract with system Xpra
        env:
          FLOE_TEST_INPUT_SYSTEM: '1'
          FLOE_TEST_INPUT_EVIDENCE: ${{ runner.temp }}/qualification/system-client-input
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/input-browsers
        shell: bash
        run: |
          set -euo pipefail
          FLOE_TEST_INPUT_ROOT=$(find "$RUNNER_TEMP/native-state/packages" -mindepth 1 -maxdepth 1 -type d)
          export FLOE_TEST_INPUT_ROOT
          FLOE_TEST_CHROMIUM_BIN=$(node -e 'console.log(require("./qualification/node_modules/playwright").chromium.executablePath())')
          export FLOE_TEST_CHROMIUM_BIN
          dpkg-query -W xpra-server xpra-common xpra-x11 xpra-codecs libxcb-imdkit1 \
            | tee "$RUNNER_TEMP/qualification/system-input-versions.log"
          go test -count=1 -run '^TestNative(ClientInput|DisplayInput|ViewerLayout)$' -v . \
            2>&1 | tee "$RUNNER_TEMP/qualification/system-client-input.log"
          # Keep the rapid focus-change batch intact. Each independent GTK4
          # startup retains its own native geometry and document receipts.
          for attempt in $(seq 1 12); do
            FLOE_TEST_INPUT_FIXTURES=gtk4 \
              FLOE_TEST_INPUT_EVIDENCE="$RUNNER_TEMP/qualification/system-density-$attempt" \
              go test -count=1 -run '^TestNativeDisplayInput$' -v . \
              2>&1 | tee "$RUNNER_TEMP/qualification/system-density-$attempt.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-${{ matrix.arch }}
          path: ${{ runner.temp }}/qualification/
          retention-days: 30
          if-no-files-found: error
  desktop:
    name: Private desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install and qualify the combined recipe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-evidence"
          FLOE_TEST_DESKTOP_INSTALL_STATE="$RUNNER_TEMP/desktop-state" \
            go test -count=1 -timeout=20m -run '^TestNativeDesktopInstallation$' -v . \
            2>&1 | tee "$RUNNER_TEMP/desktop-evidence/install.log"
          cp "$RUNNER_TEMP/desktop-state/qualification.json" "$RUNNER_TEMP/desktop-evidence/component.json"
          cp -R "$RUNNER_TEMP/desktop-state/selfcheck" "$RUNNER_TEMP/desktop-evidence/installation"
          go build -trimpath -o "$RUNNER_TEMP/desktop-prepare" ./qualification/desktop_launch
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/desktop-check" ./cmd/floe-native-apps
          root=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["root"])' "$RUNNER_TEMP/desktop-evidence/component.json")
          chmod -R a+rX "$RUNNER_TEMP/desktop-state/packages" "$RUNNER_TEMP/desktop-check"
          NATIVE_RECIPE=desktop NATIVE_ARCH="${{ matrix.arch }}" \
            NATIVE_ROOT="$root" NATIVE_CHECK="$RUNNER_TEMP/desktop-check" \
            ./scripts/qualify.sh 2>&1 | tee "$RUNNER_TEMP/desktop-evidence/distributions.log"
      - name: Install applications in the disposable native runner
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/desktop-browsers
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-pil python3-xlib python3-dbus python3-pyqt5 python3-pyqt6 \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 qtwayland5 qt6-wayland \
            flatpak snapd xdg-desktop-portal libfuse2t64 dbus-x11 xauth fonts-dejavu-core gdb
          # Only these disposable application fixtures may write core files.
          # Retain native backtraces, never the memory or launch environment.
          install -d -m 700 "$RUNNER_TEMP/desktop-cores"
          cat /proc/sys/kernel/core_pattern > "$RUNNER_TEMP/desktop-cores/original-pattern"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/desktop-cores/core.%p"
          # Prepare the disposable runner's real user service manager. Snap
          # scope and document-portal tests require it without a desktop login.
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment >/dev/null
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          npm ci --prefix qualification --ignore-scripts --no-audit --no-fund
          node qualification/node_modules/playwright/cli.js install --with-deps chromium
          sandbox=$(python3 -c 'import os,pathlib; p=list(pathlib.Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"]).rglob("chrome_sandbox")); assert len(p)==1; print(p[0])')
          sudo install -o root -g root -m 4755 "$sandbox" "$RUNNER_TEMP/desktop-chrome-sandbox"
          echo "CHROME_DEVEL_SANDBOX=$RUNNER_TEMP/desktop-chrome-sandbox" >> "$GITHUB_ENV"
          binary=$(node -e 'console.log(require("./qualification/node_modules/playwright").chromium.executablePath())')
          echo "FLOE_TEST_CHROMIUM_BIN=$binary" >> "$GITHUB_ENV"
          sudo snap wait system seed.loaded
          sudo snap install firefox
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.TextEditor org.kde.kwrite
          # These resource roots belong to this disposable runner only. A real
          # installation rejects unsafe existing roots without changing them.
          install -d -m 700 "$HOME/.var" "$HOME/.var/app" \
            "$HOME/.var/app/org.gnome.TextEditor" "$HOME/.var/app/org.kde.kwrite"
          snap list | tee "$RUNNER_TEMP/desktop-evidence/snap-versions.log"
          flatpak list --user --columns=application,version,branch,active:full \
            | tee "$RUNNER_TEMP/desktop-evidence/flatpak-versions.log"
          dpkg-query -W python3-pyqt5 python3-pyqt6 libgtk-3-0t64 libgtk-4-1 \
            | tee "$RUNNER_TEMP/desktop-evidence/toolkit-versions.log"
      - name: Verify the actual GTK 4.0 and glibc 2.31 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_input_toolkits.py
          context="$RUNNER_TEMP/desktop-gtk-builder"
          baseline="$RUNNER_TEMP/desktop-gtk-baseline"
          mkdir -p "$context/scripts" "$context/input_modules" "$baseline"
          cp /etc/ssl/certs/ca-certificates.crt "$context/"
          cp scripts/input_builder.sh scripts/input_gtk_builder.sh scripts/input_toolkits.json "$context/scripts/"
          cp -R input_modules/sources "$context/input_modules/"
          docker build --build-arg TARGET_ARCH="${{ matrix.arch }}" \
            -f qualification/desktop_compatibility/Dockerfile.gtk-native \
            -t floe-desktop-gtk-baseline "$context"
          image=$(docker image inspect --format '{{.Id}}' floe-desktop-gtk-baseline)
          docker run --rm --user "$(id -u):$(id -g)" \
            -e FLOE_DESKTOP_GTK_BUILDER_IMAGE="$image" \
            -v "$PWD:/src:ro" -v "$baseline:$baseline" "$image" \
            python3 /src/qualification/desktop_compatibility/prepare_gtk_baseline.py \
            /src/qualification/gtk4_baseline.c \
            /src/native/dist/${{ matrix.arch }}/gtk/libfloe-gtk4-native.so "$baseline/gtk4"
          FLOE_TEST_GTK4_BASELINE="$baseline/gtk4/run-application" \
            python3 scripts/qualify_desktop_applications.py \
            --state "$RUNNER_TEMP/desktop-state" --preparer "$RUNNER_TEMP/desktop-prepare" \
            --evidence "$RUNNER_TEMP/desktop-evidence/gtk-baseline" --suite gtk-baseline
      - name: Verify native documents, clipboard, reconnect and failure boundaries
        run: |
          ulimit -c unlimited
          python3 scripts/qualify_desktop_applications.py \
            --state "$RUNNER_TEMP/desktop-state" --preparer "$RUNNER_TEMP/desktop-prepare" \
            --evidence "$RUNNER_TEMP/desktop-evidence/native" --suite native
      - name: Verify strict Snap and Flatpak input, remote save and normal exit
        run: |
          ulimit -c unlimited
          python3 scripts/qualify_desktop_applications.py \
            --state "$RUNNER_TEMP/desktop-state" --preparer "$RUNNER_TEMP/desktop-prepare" \
            --evidence "$RUNNER_TEMP/desktop-evidence/sandbox" --suite sandbox
      - name: Retain native compositor crash diagnostics
        if: always()
        run: |
          restore_core_pattern() {
            if test -f "$RUNNER_TEMP/desktop-cores/original-pattern"; then
              sudo sysctl -w "kernel.core_pattern=$(cat "$RUNNER_TEMP/desktop-cores/original-pattern")"
            fi
          }
          trap restore_core_pattern EXIT
          python3 scripts/desktop_crash_diagnostics.py \
            "$RUNNER_TEMP/desktop-evidence" "$RUNNER_TEMP/desktop-cores"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: private-desktop-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/desktop-evidence/
            !${{ runner.temp }}/desktop-evidence/**/source/**
          retention-days: 30
          if-no-files-found: error
  release-gate:
    name: Release gate
    if: always()
    needs: [source, vulnerabilities, native, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          SOURCE: ${{ needs.source.result }}
          VULNERABILITIES: ${{ needs.vulnerabilities.result }}
          NATIVE: ${{ needs.native.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$SOURCE" = success && test "$VULNERABILITIES" = success && test "$NATIVE" = success && test "$DESKTOP" = success
